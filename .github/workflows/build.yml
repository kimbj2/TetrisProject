
name: Build Tetris

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Tetris tetris.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Tetris-Windows
          path: dist/Tetris.exe
